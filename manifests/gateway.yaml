# Always-on Factorio UDP gateway Deployment + internal HTTP status Service.
# Built and applied via `make gateway` (which resolves `ko://` and updates
# `ports` dynamically if WORLDS_LIST or BASE_UDP_PORT differs from the 4
# default worlds shown below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorio-gateway
  namespace: factorio
  labels:
    app: factorio-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: factorio-gateway
  template:
    metadata:
      labels:
        app: factorio-gateway
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: ${CONTROL_POOL_NAME}
      serviceAccountName: factorio-gateway
      containers:
      - name: gateway
        image: ko://github.com/arbrown/factorio-substrate/cmd/factorio-gateway
        args:
        - "--routes=${ROUTES_ARG}"
        - "--idle-timeout=${IDLE_TIMEOUT}"
        - "--ws-rotate-interval=4m"
        - "--preempt-idle-grace=${PREEMPT_IDLE_GRACE}"
        - "--max-active-worlds=${MAX_ACTIVE_WORLDS}"
        - "--workerpool-namespace=factorio"
        - "--workerpool-name=factorio"
        - "--workerpool-idle-timeout=${WORKERPOOL_IDLE_TIMEOUT}"
        - "--resume-timeout=5m"
        - "--router-http-addr=atenet-router.ate-system.svc.cluster.local:443"
        - "--router-tls=true"
        - "--router-server-name=atenet-router.ate-system.svc"
        - "--ateapi-address=api.ate-system.svc.cluster.local:443"
        - "--ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem"
        - "--ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem"
        - "--ateapi-server-name=api.ate-system.svc"
        - "--image-poll-interval=30m"
        - "--template-atespace=factorio"
        - "--template-name=factorio-server"
        - "--upstream-repo=factoriotools/factorio"
        - "--upstream-tag=stable"
        ports:
        - name: udp-port-34197
          containerPort: 34197
          hostPort: 34197
          protocol: UDP
        - name: udp-port-34198
          containerPort: 34198
          hostPort: 34198
          protocol: UDP
        - name: udp-port-34199
          containerPort: 34199
          hostPort: 34199
          protocol: UDP
        - name: udp-port-34200
          containerPort: 34200
          hostPort: 34200
          protocol: UDP
        - name: http-status
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        - name: servicedns-ca
          mountPath: /run/servicedns-ca
          readOnly: true
      volumes:
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: factorio-gateway-http
  namespace: factorio
spec:
  type: ClusterIP
  selector:
    app: factorio-gateway
  ports:
  - name: status-http
    port: 8080
    targetPort: 8080
    protocol: TCP
