# Declarative Factorio world Actors reconciled via `make actors`
# (`hack/deploy-actors.sh`). Agent Substrate Actors live in Substrate's
# PostgreSQL control plane rather than Kubernetes etcd, so they are created
# via `kubectl ate` rather than `kubectl apply`.
# Overriding WORLDS_LIST or BASE_UDP_PORT in `.env` takes precedence over this list.
atespace: factorio
template: factorio-server
baseUdpPort: 34197
actors:
  - name: world-vanilla
    udpPort: 34197
    description: "Super-Dense Megabase (600% Rich Ores, Peaceful, No Cliffs)"
  - name: world-deathworld
    udpPort: 34198
    description: "Deathworld Biter Swarm (400% Enemy Bases, Armed Spawn Bunker)"
  - name: world-railworld
    udpPort: 34199
    description: "Rail World Express (Giant 600% Outpost Patches, Train Depot Chest)"
  - name: world-ribbonworld
    udpPort: 34200
    description: "Ribbon World 64-Tile Strip (64-Tile Tall Horizontal World, 600% Ores)"
