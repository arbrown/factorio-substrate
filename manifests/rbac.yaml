# RBAC for factorio-gateway so it can scale WorkerPool/factorio 0 <-> N on
# demand and watch worker Nodes for GCE 30-second Spot preemption notices.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factorio-gateway
  namespace: factorio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factorio-gateway-workerpool-scaler
  namespace: factorio
rules:
- apiGroups: ["ate.dev"]
  resources: ["workerpools"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factorio-gateway-workerpool-scaler
  namespace: factorio
subjects:
- kind: ServiceAccount
  name: factorio-gateway
  namespace: factorio
roleRef:
  kind: Role
  name: factorio-gateway-workerpool-scaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factorio-gateway-node-watcher
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factorio-gateway-node-watcher
subjects:
- kind: ServiceAccount
  name: factorio-gateway
  namespace: factorio
roleRef:
  kind: ClusterRole
  name: factorio-gateway-node-watcher
  apiGroup: rbac.authorization.k8s.io
