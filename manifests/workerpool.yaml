# Scale-to-zero WorkerPool for Factorio Actor sandboxes.
# Rendered by `make workerpool` (`envsubst '${MAX_ACTIVE_WORLDS} ${WORKER_IMAGE}'`).
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: factorio
  namespace: factorio
  labels:
    workload: factorio
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
spec:
  # Single physical worker pod that multiplexes all configured Factorio worlds
  # on demand. Automatically scaled 0 -> 1 on inbound UDP traffic and 1 -> 0
  # after `WORKERPOOL_IDLE_TIMEOUT`.
  replicas: ${MAX_ACTIVE_WORLDS}
  workerImage: ${WORKER_IMAGE}
  sandboxClasses:
  - name: gvisor
  template:
    nodeSelector:
      cloud.google.com/compute-class: factorio-substrate-worker
    tolerations:
    - key: "ate.dev/sandboxClass"
      operator: "Equal"
      value: "gvisor"
      effect: "NoSchedule"
    - key: "cloud.google.com/compute-class"
      operator: "Equal"
      value: "factorio-substrate-worker"
      effect: "NoSchedule"
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 4Gi
