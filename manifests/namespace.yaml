# Namespace for Factorio workloads and the UDP gateway.
# `ate.dev/api-access: "true"` allows pods with a PodIdentity certificate to
# talk to `ate-api-server` and `atenet-router` over mTLS.
apiVersion: v1
kind: Namespace
metadata:
  name: factorio
  labels:
    ate.dev/api-access: "true"
